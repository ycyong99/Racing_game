<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Apex Racer app icon. The artwork group is scaled down for the maskable variant. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3a4c"/>
      <stop offset="55%" stop-color="#d40b1e"/>
      <stop offset="100%" stop-color="#7a0612"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ff6ff"/>
      <stop offset="100%" stop-color="#14364a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g id="art" transform="translate(256 276) scale(1.12) translate(-256 -276)">
    <!-- Racing line sweeping through the apex -->
    <path d="M40 392 Q 250 318 476 360" fill="none" stroke="url(#line)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Speed streaks -->
    <g stroke="#00ffcc" stroke-linecap="round" opacity="0.75">
      <line x1="36" y1="246" x2="112" y2="246" stroke-width="7"/>
      <line x1="58" y1="272" x2="104" y2="272" stroke-width="6"/>
      <line x1="24" y1="294" x2="96" y2="294" stroke-width="5"/>
    </g>

    <!-- Hypercar silhouette (side view, facing right) -->
    <!-- Rear wing on struts -->
    <path d="M118 256 L124 266 M140 254 L144 264" stroke="#1a1d24" stroke-width="5"/>
    <path d="M84 246 L160 240 L162 250 L88 256 Z" fill="#1a1d24"/>
    <!-- Low wedge body: high rear deck, short cab-forward canopy, long sloping nose -->
    <path d="M94 306 L98 268 L156 258 L232 250 L272 224 Q298 212 330 217 L370 238 L452 272 L460 290 Q458 304 442 307 L104 312 Z"
          fill="url(#paint)" stroke="#ff8a96" stroke-width="2" stroke-linejoin="round"/>
    <!-- Canopy -->
    <path d="M254 249 L278 229 Q300 220 326 224 L352 242 Z" fill="url(#glass)"/>
    <!-- Side air intake -->
    <path d="M226 266 L286 260 L262 286 Z" fill="#1a1d24"/>
    <!-- Carbon sill -->
    <path d="M200 298 L330 294 L320 304 L208 306 Z" fill="#1a1d24"/>
    <!-- Lights -->
    <rect x="96" y="276" width="22" height="7" rx="3" fill="#ff2a40" filter="url(#glow)"/>
    <path d="M428 266 L452 275 L448 282 L424 273 Z" fill="#e8fbff" filter="url(#glow)"/>

    <!-- Wheels -->
    <g>
      <circle cx="170" cy="308" r="32" fill="#0b0c10"/>
      <circle cx="170" cy="308" r="20" fill="#c9d2dc"/>
      <circle cx="170" cy="308" r="8" fill="#0b0c10"/>
      <circle cx="372" cy="308" r="32" fill="#0b0c10"/>
      <circle cx="372" cy="308" r="20" fill="#c9d2dc"/>
      <circle cx="372" cy="308" r="8" fill="#0b0c10"/>
    </g>
  </g>
</svg>
